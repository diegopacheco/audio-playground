[package]
name = "fft-spectrum-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
