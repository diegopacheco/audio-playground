<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #2b2b2b; }
      .t { font-size: 20px; text-anchor: middle; }
      .s { font-size: 16px; text-anchor: middle; fill: #555; }
      .g { font-size: 22px; font-weight: 700; }
      .l { font-size: 17px; fill: #444; }
      .box { stroke: #2b2b2b; stroke-width: 2; filter: url(#wobble); }
      .grp { fill: none; stroke: #888; stroke-width: 1.6; stroke-dasharray: 8 6; filter: url(#wobble); }
      .arr { fill: none; stroke: #2b2b2b; stroke-width: 2; marker-end: url(#head); filter: url(#wobble); }
      .dash { stroke-dasharray: 7 5; }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="530">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="1000" height="530" fill="#fffdf8"/>

  <rect class="grp" x="20" y="20" width="960" height="200" rx="14"/>
  <text class="g" x="36" y="46">Browser: React + Web Audio</text>

  <rect class="box" x="50" y="62" width="170" height="55" rx="10" fill="#fde2e4"/>
  <text class="t" x="135" y="88">Test tone</text>
  <text class="s" x="135" y="107">OscillatorNode</text>

  <rect class="box" x="50" y="140" width="170" height="55" rx="10" fill="#fde2e4"/>
  <text class="t" x="135" y="166">Microphone</text>
  <text class="s" x="135" y="185">getUserMedia</text>

  <rect class="box" x="270" y="98" width="190" height="62" rx="10" fill="#e2ece9"/>
  <text class="t" x="365" y="124">AudioWorklet pcm-tap</text>
  <text class="s" x="365" y="145">ScriptProcessor fallback</text>

  <rect class="box" x="510" y="98" width="170" height="62" rx="10" fill="#fff1c1"/>
  <text class="t" x="595" y="124">Framer</text>
  <text class="s" x="595" y="145">512 .. 8192 samples</text>

  <rect class="box" x="730" y="58" width="225" height="140" rx="10" fill="#dfe7fd"/>
  <text class="t" x="842" y="88">Live bars view</text>
  <text class="t" x="842" y="116">Scrolling spectrogram</text>
  <text class="t" x="842" y="144">Peak readout</text>
  <text class="t" x="842" y="172">Snapshot</text>

  <path class="arr" d="M220,90 L268,120"/>
  <path class="arr" d="M220,167 L268,140"/>
  <path class="arr" d="M460,129 L508,129"/>

  <path class="arr" d="M595,160 L595,250 L150,250 L150,328"/>
  <text class="l" x="330" y="243">binary Float32 frames</text>
  <path class="arr dash" d="M150,250 L35,250 L35,445 L48,445"/>
  <text class="l" x="44" y="275">snapshot</text>
  <text class="l" x="44" y="294">JSON</text>

  <rect class="grp" x="20" y="300" width="960" height="210" rx="14"/>
  <text class="g" x="640" y="330">Rust backend: axum</text>

  <rect class="box" x="60" y="330" width="190" height="60" rx="10" fill="#cddafd"/>
  <text class="t" x="155" y="357">/api/stream</text>
  <text class="s" x="155" y="377">WebSocket</text>

  <rect class="box" x="60" y="415" width="190" height="60" rx="10" fill="#cddafd"/>
  <text class="t" x="155" y="442">POST /api/spectrum</text>
  <text class="s" x="155" y="462">one-shot frame</text>

  <rect class="box" x="290" y="372" width="150" height="62" rx="10" fill="#e2ece9"/>
  <text class="t" x="365" y="399">pcm decode</text>
  <text class="s" x="365" y="420">Float32 LE</text>

  <rect class="box" x="475" y="372" width="160" height="62" rx="10" fill="#fff1c1"/>
  <text class="t" x="555" y="399">trait Window</text>
  <text class="s" x="555" y="420">Hann Hamming Rect</text>

  <rect class="box" x="670" y="372" width="140" height="62" rx="10" fill="#fde2e4"/>
  <text class="t" x="740" y="399">trait Transform</text>
  <text class="s" x="740" y="420">Radix2Fft</text>

  <rect class="box" x="840" y="372" width="125" height="62" rx="10" fill="#dfe7fd"/>
  <text class="t" x="902" y="399">dB + log bars</text>
  <text class="s" x="902" y="420">peak finder</text>

  <path class="arr" d="M250,360 L288,392"/>
  <path class="arr" d="M250,445 L288,415"/>
  <path class="arr" d="M440,403 L473,403"/>
  <path class="arr" d="M635,403 L668,403"/>
  <path class="arr" d="M810,403 L838,403"/>

  <path class="arr" d="M902,372 L902,200"/>
  <text class="l" x="760" y="262">JSON SpectrumFrame</text>
</svg>
