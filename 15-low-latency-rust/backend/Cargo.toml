[package]
name = "low-latency"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
