<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1e293b; }
      .title { font-size: 30px; font-weight: 700; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .edge { font-size: 17px; fill: #475569; }
      .box { stroke: #1e293b; stroke-width: 2.2; filter: url(#wobble); }
      .line { stroke: #1e293b; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#arrow); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="560">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" class="title">09 BPM Detection</text>

  <rect x="30" y="80" width="250" height="150" rx="14" fill="#dbeafe" class="box"/>
  <text x="155" y="112" text-anchor="middle" class="head">React UI (bun + Vite)</text>
  <text x="155" y="142" text-anchor="middle" class="body">upload WAV / synthetic loop</text>
  <text x="155" y="166" text-anchor="middle" class="body">audio player + beat light</text>
  <text x="155" y="190" text-anchor="middle" class="body">envelope + autocorr charts</text>
  <text x="155" y="214" text-anchor="middle" class="body">port 5109, proxies /api</text>

  <rect x="370" y="80" width="260" height="150" rx="14" fill="#fef3c7" class="box"/>
  <text x="500" y="112" text-anchor="middle" class="head">axum API (Rust)</text>
  <text x="500" y="142" text-anchor="middle" class="body">POST /api/analyze</text>
  <text x="500" y="166" text-anchor="middle" class="body">GET /api/synthetic?bpm=</text>
  <text x="500" y="190" text-anchor="middle" class="body">port 8109</text>

  <rect x="720" y="80" width="250" height="150" rx="14" fill="#fce7f3" class="box"/>
  <text x="845" y="112" text-anchor="middle" class="head">Synth drum loop</text>
  <text x="845" y="142" text-anchor="middle" class="body">kick + snare + hi-hat</text>
  <text x="845" y="166" text-anchor="middle" class="body">sample exact eighths</text>
  <text x="845" y="190" text-anchor="middle" class="body">16-bit WAV writer</text>

  <path d="M280 135 L366 135" class="line"/>
  <text x="323" y="125" text-anchor="middle" class="edge">WAV bytes</text>
  <path d="M370 180 L284 180" class="line"/>
  <text x="327" y="200" text-anchor="middle" class="edge">JSON</text>
  <path d="M630 155 L716 155" class="line"/>

  <rect x="30" y="330" width="210" height="170" rx="14" fill="#dcfce7" class="box"/>
  <text x="135" y="362" text-anchor="middle" class="head">WAV reader</text>
  <text x="135" y="392" text-anchor="middle" class="body">16-bit PCM / 32-bit float</text>
  <text x="135" y="416" text-anchor="middle" class="body">stereo to mono mixdown</text>
  <text x="135" y="440" text-anchor="middle" class="body">resample to 22050 Hz</text>
  <text x="135" y="464" text-anchor="middle" class="body">box lowpass + lerp</text>

  <rect x="275" y="330" width="210" height="170" rx="14" fill="#e0e7ff" class="box"/>
  <text x="380" y="362" text-anchor="middle" class="head">OnsetDetector</text>
  <text x="380" y="392" text-anchor="middle" class="body">SpectralFlux: own FFT</text>
  <text x="380" y="416" text-anchor="middle" class="body">log mag, half-wave rect</text>
  <text x="380" y="440" text-anchor="middle" class="body">EnergyFlux alternative</text>
  <text x="380" y="464" text-anchor="middle" class="body">1024 frame / 128 hop</text>

  <rect x="520" y="330" width="210" height="170" rx="14" fill="#ffedd5" class="box"/>
  <text x="625" y="362" text-anchor="middle" class="head">TempoEstimator</text>
  <text x="625" y="392" text-anchor="middle" class="body">autocorrelation</text>
  <text x="625" y="416" text-anchor="middle" class="body">comb of 4 harmonics</text>
  <text x="625" y="440" text-anchor="middle" class="body">60-200 BPM, 0.02 steps</text>
  <text x="625" y="464" text-anchor="middle" class="body">octave check at lag / 2</text>

  <rect x="765" y="330" width="205" height="170" rx="14" fill="#f3e8ff" class="box"/>
  <text x="867" y="362" text-anchor="middle" class="head">BeatTracker</text>
  <text x="867" y="392" text-anchor="middle" class="body">best phase on the</text>
  <text x="867" y="416" text-anchor="middle" class="body">tempo grid, then snap</text>
  <text x="867" y="440" text-anchor="middle" class="body">each beat to local max</text>
  <text x="867" y="464" text-anchor="middle" class="body">frames to seconds</text>

  <path d="M500 230 C 500 280, 135 270, 135 326" class="line"/>
  <text x="340" y="312" text-anchor="middle" class="edge">analyze pipeline</text>
  <path d="M240 415 L271 415" class="line"/>
  <path d="M485 415 L516 415" class="line"/>
  <path d="M730 415 L761 415" class="line"/>
  <path d="M867 330 C 867 270, 640 280, 600 234" class="line"/>
  <text x="690" y="312" text-anchor="middle" class="edge">bpm, beats, envelope, autocorr</text>
</svg>
