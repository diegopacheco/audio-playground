<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', cursive; fill: #2b2b2b; }</style>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#fffdf8"/>
  <text x="490" y="40" font-size="34" font-weight="700" text-anchor="middle">Drum Machine Architecture</text>

  <g filter="url(#wobble)" stroke="#2b2b2b" stroke-width="2">
    <rect x="30" y="80" width="420" height="440" rx="16" fill="#eef5ff"/>
    <rect x="530" y="80" width="420" height="440" rx="16" fill="#fff3e8"/>

    <rect x="60" y="130" width="170" height="70" rx="10" fill="#d7f5dd"/>
    <rect x="250" y="130" width="170" height="70" rx="10" fill="#ffe9a8"/>
    <rect x="60" y="250" width="170" height="80" rx="10" fill="#fcd5d5"/>
    <rect x="250" y="250" width="170" height="80" rx="10" fill="#e4dcff"/>
    <rect x="60" y="390" width="360" height="90" rx="10" fill="#d4eefa"/>

    <rect x="560" y="130" width="360" height="70" rx="10" fill="#ffe9a8"/>
    <rect x="560" y="240" width="170" height="80" rx="10" fill="#d7f5dd"/>
    <rect x="750" y="240" width="170" height="80" rx="10" fill="#fcd5d5"/>
    <rect x="560" y="360" width="170" height="80" rx="10" fill="#e4dcff"/>
    <rect x="750" y="360" width="170" height="80" rx="10" fill="#d4eefa"/>
  </g>

  <text x="240" y="112" font-size="26" font-weight="700" text-anchor="middle">Browser  (React + Web Audio)</text>
  <text x="740" y="112" font-size="26" font-weight="700" text-anchor="middle">Rust backend  (axum)</text>

  <text x="145" y="160" font-size="22" text-anchor="middle">StepGrid</text>
  <text x="145" y="185" font-size="18" text-anchor="middle">4 x 16 toggles</text>
  <text x="335" y="160" font-size="22" text-anchor="middle">Transport</text>
  <text x="335" y="185" font-size="18" text-anchor="middle">play, BPM, swing</text>
  <text x="145" y="282" font-size="22" text-anchor="middle">Sequencer</text>
  <text x="145" y="307" font-size="18" text-anchor="middle">100ms lookahead</text>
  <text x="335" y="282" font-size="22" text-anchor="middle">Voices</text>
  <text x="335" y="307" font-size="18" text-anchor="middle">oscillators, noise, biquads</text>
  <text x="240" y="422" font-size="22" text-anchor="middle">PatternBar + api.ts</text>
  <text x="240" y="452" font-size="18" text-anchor="middle">load / save patterns, export WAV</text>

  <text x="740" y="160" font-size="22" text-anchor="middle">api.rs  routes</text>
  <text x="740" y="185" font-size="18" text-anchor="middle">/api/patterns  /api/render</text>
  <text x="645" y="272" font-size="22" text-anchor="middle">PatternStore</text>
  <text x="645" y="297" font-size="18" text-anchor="middle">RwLock map + built-ins</text>
  <text x="835" y="272" font-size="22" text-anchor="middle">sequencer.rs</text>
  <text x="835" y="297" font-size="18" text-anchor="middle">step time + swing mix</text>
  <text x="645" y="392" font-size="22" text-anchor="middle">trait Instrument</text>
  <text x="645" y="417" font-size="18" text-anchor="middle">Kick Snare HiHat Clap</text>
  <text x="835" y="392" font-size="22" text-anchor="middle">wav.rs</text>
  <text x="835" y="417" font-size="18" text-anchor="middle">16-bit PCM writer</text>

  <g stroke="#2b2b2b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M145 200 L145 248"/>
    <path d="M335 200 L170 248"/>
    <path d="M230 290 L248 290"/>
    <path d="M420 420 L558 190"/>
    <path d="M700 200 L660 238"/>
    <path d="M780 200 L820 238"/>
    <path d="M835 320 L700 358"/>
    <path d="M870 320 L870 358"/>
  </g>
  <text x="490" y="160" font-size="18" text-anchor="middle">JSON/WAV</text>
  <text x="240" y="510" font-size="18" text-anchor="middle">live playback stays in the browser</text>
  <text x="740" y="480" font-size="18" text-anchor="middle">offline render, same synthesis recipes</text>
</svg>
