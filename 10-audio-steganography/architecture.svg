<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 520" width="1010" height="520">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #2b2b2b; }
      .t { font-size: 24px; font-weight: 700; }
      .s { font-size: 18px; }
      .box { stroke: #3a3a3a; stroke-width: 2; filter: url(#wobble); }
      .line { stroke: #3a3a3a; stroke-width: 2; fill: none; filter: url(#wobble); marker-end: url(#arrow); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1010" height="520">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="1010" height="520" fill="#fffdf8"/>

  <rect class="box" x="30" y="40" width="260" height="170" rx="14" fill="#d7ecff"/>
  <text class="t" x="160" y="75" text-anchor="middle">React UI (Vite)</text>
  <text class="s" x="160" y="105" text-anchor="middle">Encode / Decode tabs</text>
  <text class="s" x="160" y="130" text-anchor="middle">method + bits, capacity bar</text>
  <text class="s" x="160" y="155" text-anchor="middle">A/B player, stats</text>
  <text class="s" x="160" y="180" text-anchor="middle">diff waveform canvas</text>

  <rect class="box" x="380" y="40" width="240" height="170" rx="14" fill="#e3f7dc"/>
  <text class="t" x="500" y="75" text-anchor="middle">api.rs (axum)</text>
  <text class="s" x="500" y="105" text-anchor="middle">POST /api/encode</text>
  <text class="s" x="500" y="130" text-anchor="middle">POST /api/decode</text>
  <text class="s" x="500" y="155" text-anchor="middle">GET /api/carrier</text>
  <text class="s" x="500" y="180" text-anchor="middle">GET|POST /api/capacity</text>

  <rect class="box" x="710" y="40" width="270" height="170" rx="14" fill="#fff1c9"/>
  <text class="t" x="845" y="75" text-anchor="middle">trait Stego</text>
  <text class="s" x="845" y="105" text-anchor="middle">capacity / encode / decode</text>
  <text class="s" x="845" y="135" text-anchor="middle">frame.rs: STG1 magic</text>
  <text class="s" x="845" y="160" text-anchor="middle">+ u32 length + payload</text>
  <text class="s" x="845" y="185" text-anchor="middle">+ crc32 (hand-written)</text>

  <rect class="box" x="30" y="310" width="260" height="170" rx="14" fill="#efe3ff"/>
  <text class="t" x="160" y="345" text-anchor="middle">carrier.rs + metrics.rs</text>
  <text class="s" x="160" y="380" text-anchor="middle">6 s chord clip, 44.1 kHz</text>
  <text class="s" x="160" y="410" text-anchor="middle">SNR dB, max sample diff</text>
  <text class="s" x="160" y="440" text-anchor="middle">sent as x-* headers</text>

  <rect class="box" x="380" y="310" width="240" height="170" rx="14" fill="#fde0e6"/>
  <text class="t" x="500" y="345" text-anchor="middle">wav.rs + base64.rs</text>
  <text class="s" x="500" y="380" text-anchor="middle">RIFF chunk walker</text>
  <text class="s" x="500" y="410" text-anchor="middle">16-bit PCM, downmix</text>
  <text class="s" x="500" y="440" text-anchor="middle">mono writer</text>

  <rect class="box" x="680" y="310" width="145" height="170" rx="14" fill="#d9f4f0"/>
  <text class="t" x="752" y="345" text-anchor="middle">LsbStego</text>
  <text class="s" x="752" y="380" text-anchor="middle">1-4 low bits</text>
  <text class="s" x="752" y="410" text-anchor="middle">per sample</text>
  <text class="s" x="752" y="440" text-anchor="middle">|diff| ≤ 2^b - 1</text>

  <rect class="box" x="845" y="310" width="150" height="170" rx="14" fill="#ffe6cc"/>
  <text class="t" x="920" y="345" text-anchor="middle">Ultrasonic</text>
  <text class="s" x="920" y="380" text-anchor="middle">FSK 18.2/19.2 kHz</text>
  <text class="s" x="920" y="410" text-anchor="middle">8 ms symbols</text>
  <text class="s" x="920" y="440" text-anchor="middle">Goertzel + Hann</text>

  <path class="line" d="M290,105 L378,105"/>
  <text class="s" x="334" y="95" text-anchor="middle">json</text>
  <path class="line" d="M380,165 L292,165"/>
  <text class="s" x="334" y="190" text-anchor="middle">wav</text>
  <path class="line" d="M620,125 L708,125"/>
  <path class="line" d="M500,210 L500,308"/>
  <path class="line" d="M400,210 L280,308"/>
  <path class="line" d="M752,210 L752,308"/>
  <path class="line" d="M920,210 L920,308"/>
</svg>
