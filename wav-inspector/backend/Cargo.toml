[package]
name = "wav-inspector"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
