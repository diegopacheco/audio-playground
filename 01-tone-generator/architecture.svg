<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #2b2b2b; }
      .t { font-size: 24px; font-weight: 700; }
      .s { font-size: 18px; }
      .box { stroke: #3a3a3a; stroke-width: 2; filter: url(#wobble); }
      .line { stroke: #3a3a3a; stroke-width: 2; fill: none; filter: url(#wobble); marker-end: url(#arrow); }
    </style>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="460">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#fffdf8"/>

  <rect class="box" x="30" y="40" width="250" height="160" rx="14" fill="#d7ecff"/>
  <text class="t" x="155" y="75" text-anchor="middle">React UI (Vite :5101)</text>
  <text class="s" x="155" y="105" text-anchor="middle">ToneForm: waveform, Hz,</text>
  <text class="s" x="155" y="127" text-anchor="middle">duration, amplitude, rate</text>
  <text class="s" x="155" y="155" text-anchor="middle">audio player + download</text>
  <text class="s" x="155" y="180" text-anchor="middle">canvas + header panel</text>

  <rect class="box" x="370" y="40" width="230" height="160" rx="14" fill="#e3f7dc"/>
  <text class="t" x="485" y="75" text-anchor="middle">api.rs (axum :8101)</text>
  <text class="s" x="485" y="110" text-anchor="middle">POST /api/tone</text>
  <text class="s" x="485" y="135" text-anchor="middle">GET /api/waveforms</text>
  <text class="s" x="485" y="170" text-anchor="middle">400 JSON on bad input</text>

  <rect class="box" x="690" y="40" width="240" height="160" rx="14" fill="#fff1c9"/>
  <text class="t" x="810" y="75" text-anchor="middle">tone.rs</text>
  <text class="s" x="810" y="110" text-anchor="middle">validate request</text>
  <text class="s" x="810" y="135" text-anchor="middle">Nyquist, rate, amplitude</text>
  <text class="s" x="810" y="170" text-anchor="middle">count = rate x ms / 1000</text>

  <rect class="box" x="690" y="270" width="240" height="160" rx="14" fill="#fde0e6"/>
  <text class="t" x="810" y="305" text-anchor="middle">oscillator.rs</text>
  <text class="s" x="810" y="340" text-anchor="middle">trait Oscillator</text>
  <text class="s" x="810" y="365" text-anchor="middle">Sine Square Saw Triangle</text>
  <text class="s" x="810" y="400" text-anchor="middle">phase -> i16 samples</text>

  <rect class="box" x="370" y="270" width="230" height="160" rx="14" fill="#ece3ff"/>
  <text class="t" x="485" y="305" text-anchor="middle">wav.rs</text>
  <text class="s" x="485" y="340" text-anchor="middle">hand-written 44-byte</text>
  <text class="s" x="485" y="365" text-anchor="middle">RIFF/WAVE header</text>
  <text class="s" x="485" y="400" text-anchor="middle">+ little-endian PCM</text>

  <rect class="box" x="30" y="270" width="250" height="160" rx="14" fill="#d9f3f1"/>
  <text class="t" x="155" y="305" text-anchor="middle">src/audio (TS)</text>
  <text class="s" x="155" y="340" text-anchor="middle">parseWavHeader: 13 fields</text>
  <text class="s" x="155" y="365" text-anchor="middle">pcmSamples: Int16Array</text>
  <text class="s" x="155" y="400" text-anchor="middle">toPoints: canvas path</text>

  <path class="line" d="M282,100 L366,100"/>
  <text class="s" x="324" y="90" text-anchor="middle">JSON</text>
  <path class="line" d="M602,120 L686,120"/>
  <path class="line" d="M810,202 L810,266"/>
  <path class="line" d="M688,350 L604,350"/>
  <text class="s" x="646" y="340" text-anchor="middle">i16 PCM</text>
  <path class="line" d="M440,268 L440,204"/>
  <text class="s" x="410" y="240" text-anchor="middle">bytes</text>
  <path class="line" d="M368,170 C320,200 240,230 200,266"/>
  <text class="s" x="300" y="250" text-anchor="middle">audio/wav</text>
  <path class="line" d="M120,268 L120,204"/>
</svg>
